name: Build Mobile Apps (Android & iOS)
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Accept Android Licenses
        run: yes | flutter doctor --android-licenses

      - name: Build APK
        run: |
          cd mobile_project
          flet build apk --project "AudioKitob"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioKitob-Android
          path: mobile_project/build/apk/*.apk

  ios:
    name: Build iOS App
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Build iOS (No Signing)
        run: |
          cd mobile_project
          # iOS building without certificates can be tricky, 
          # we use --no-codesign if supported or just build for simulator/testing
          flet build ios --no-codesign || echo "iOS build failed because of signing requirements. Manual signing needed for real devices."

      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: AudioKitob-iOS
          path: mobile_project/build/ios/iphoneos/*.app
        continue-on-error: true

